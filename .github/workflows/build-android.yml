name: build-android

# Compile les deux applications Android (abonné + admin) en APK release,
# connectées au backend Supabase RÉEL (aucun mode démo), puis publie une
# GitHub Release téléchargeable.
#
# Prérequis (recommandé) : Settings → Secrets and variables → Actions :
#   - SUPABASE_URL       ex. https://xxxxx.supabase.co
#   - SUPABASE_ANON_KEY  la clé publique (anon/publishable) du projet
#
# Si les secrets sont absents, les valeurs projet fournies ci-dessous sont
# utilisées (clé anon = publique par design Supabase ; pas de service_role).
#
# Déclenchement : push sur main, ou manuel (Actions → build-android → Run),
# ou : gh workflow run build-android.yml --ref main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "cineva/apps/cineva_mobile/**"
      - "cineva/apps/cineva_admin/**"
      - "cineva/packages/**"
      - "cineva/scripts/apply_android_icon.py"

permissions:
  contents: write # création de la Release
  issues: write   # rapport d'échec lisible hors Azure blob

jobs:
  apk:
    name: APK release (Cineva User + Admin)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter 3.24.5 (Dart 3.5.4 — version validée du projet)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Refuser le mode démo — exiger la configuration Supabase réelle
        env:
          SECRET_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Secrets prioritaires ; repli = projet Cineva fourni (clé anon publique).
          URL="${SECRET_URL:-https://jbsagyavtiiqloutmqdk.supabase.co}"
          KEY="${SECRET_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impic2FneWF2dGlpcWxvdXRtcWRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjYzOTYsImV4cCI6MjA5OTAwMjM5Nn0.151rIhQiYxU7ovc5D51bm8OhWmPgO8irUx1OeZGhhg8}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL et/ou SUPABASE_ANON_KEY absents. Sans eux, l'APK serait compilé en MODE DÉMO, ce qui est refusé ici."
            exit 1
          fi
          if [ -n "$SECRET_URL" ] && [ -n "$SECRET_KEY" ]; then
            echo "Configuration Supabase via secrets GitHub — backend réel."
          else
            echo "Configuration Supabase via repli projet (secrets absents) — backend réel."
          fi
          echo "SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Générer les châssis Android des deux applications
        run: |
          set -e
          for app in cineva_mobile cineva_admin; do
            echo "── flutter create : $app"
            (cd "cineva/apps/$app" && flutter create --no-pub --platforms=android --org com.cineva --project-name "$app" .)
          done

      - name: Noms affichés sous les icônes + minSdk 24
        run: |
          sed -i 's/android:label="cineva_mobile"/android:label="Cineva"/' \
            cineva/apps/cineva_mobile/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="cineva_admin"/android:label="Cineva Admin"/' \
            cineva/apps/cineva_admin/android/app/src/main/AndroidManifest.xml
          # Plugins modernes (video_player, file_picker, firebase_*) exigent minSdk ≥ 21 ;
          # on force 24 pour une surface d'API stable.
          for app in cineva_mobile cineva_admin; do
            gradle="cineva/apps/$app/android/app/build.gradle"
            if [ -f "$gradle" ]; then
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$gradle" || true
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$gradle" || true
              # Kotlin build.gradle.kts variants
              if [ -f "cineva/apps/$app/android/app/build.gradle.kts" ]; then
                sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' \
                  "cineva/apps/$app/android/app/build.gradle.kts" || true
              fi
            fi
          done

      - name: Icônes de lancement Cineva
        run: |
          python3 -m pip install --user --quiet pillow
          for app in cineva_mobile cineva_admin; do
            echo "── icônes : $app"
            python3 cineva/scripts/apply_android_icon.py "cineva/apps/$app"
          done

      - name: pub get (diagnostic)
        run: |
          set -e
          for app in cineva_mobile cineva_admin; do
            echo "══ pub get : $app"
            (cd "cineva/apps/$app" && flutter pub get)
          done

      - name: Compiler cineva_mobile (release, backend réel)
        id: build_mobile
        working-directory: cineva/apps/cineva_mobile
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_ENABLED=false \
            2>&1 | tee /tmp/build-mobile.log

      - name: Compiler cineva_admin (release, backend réel)
        id: build_admin
        working-directory: cineva/apps/cineva_admin
        run: |
          set -o pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=FIREBASE_ENABLED=false \
            2>&1 | tee /tmp/build-admin.log

      - name: Préparer les APK
        run: |
          cp cineva/apps/cineva_mobile/build/app/outputs/flutter-apk/app-release.apk Cineva-User.apk
          cp cineva/apps/cineva_admin/build/app/outputs/flutter-apk/app-release.apk Cineva-Admin.apk
          ls -lh Cineva-*.apk

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_RUN_NUMBER}"
          {
            echo "Applications Android Cineva — APK release installables directement"
            echo "(autoriser les « sources inconnues » à l'installation)."
            echo ""
            echo "- **Cineva-User.apk** — application abonné (com.cineva.cineva_mobile)"
            echo "- **Cineva-Admin.apk** — console d'administration (com.cineva.cineva_admin)"
            echo ""
            echo "Connectées au **backend Supabase réel** (configuration injectée à la compilation)."
            echo "Notifications push désactivées dans cette version (FCM non configuré)."
            echo "Signature : clé de debug — installable en direct ; une clé dédiée sera"
            echo "nécessaire pour le Play Store."
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Cineva-User.apk Cineva-Admin.apk --clobber
          else
            gh release create "$TAG" Cineva-User.apk Cineva-Admin.apk \
              --title "Cineva Android — build #${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md
          fi
          echo "Release publiée : $TAG"

      - name: Publier le rapport d'échec (issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## build-android échec — run ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "### build-mobile (tail)"
            echo '```'
            tail -n 120 /tmp/build-mobile.log 2>/dev/null || echo "(pas de log mobile)"
            echo '```'
            echo ""
            echo "### build-admin (tail)"
            echo '```'
            tail -n 80 /tmp/build-admin.log 2>/dev/null || echo "(pas de log admin)"
            echo '```'
          } > /tmp/fail-report.md
          # Une seule issue ouverte « build-android failure report » réutilisée
          EXISTING=$(gh issue list --label build-android-fail --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/fail-report.md
          else
            gh issue create \
              --title "build-android failure report" \
              --label "build-android-fail" \
              --body-file /tmp/fail-report.md || \
            gh issue create \
              --title "build-android failure report" \
              --body-file /tmp/fail-report.md
          fi
