name: build-artifacts

# Produit les trois binaires demandés en un seul run, connectés au backend
# Supabase RÉEL (aucun mode démo) :
#
#   1. Cineva-User.apk           — application abonné  (apps/cineva_mobile, Android)
#   2. Cineva-Admin.apk          — console admin       (apps/cineva_admin,  Android)
#   3. Cineva-User-Windows.zip   — application abonné  (apps/cineva_windows, Windows x64)
#   4. Cineva-Admin-Windows.zip  — console admin       (apps/cineva_admin,   Windows x64)
#
# Les deux .exe sont compilés par le même job, en matrice (2 runners en
# parallèle, `fail-fast: false`) : si la console admin échoue, l'exe abonné est
# quand même publié, et inversement.
#
# Un job d'analyse statique (flutter analyze + tests) tourne AVANT les builds :
# il échoue vite et publie son log en artefact, ce qui évite de brûler 20 minutes
# de compilation sur une erreur de Dart.
#
# Déclenchement :
#   - push sur une branche arena/**  (branches de travail)
#   - manuel : gh workflow run build-artifacts.yml --ref <branche>
#
# Sur `main`, c'est le workflow historique `build-android.yml` qui reste actif ;
# celui-ci peut y être lancé à la demande pour obtenir aussi le .exe Windows.
#
# Secrets optionnels (Settings → Secrets and variables → Actions) :
#   SUPABASE_URL, SUPABASE_ANON_KEY, TMDB_API_KEY.
# À défaut, les valeurs projet (clé anon publique par design Supabase) sont utilisées.
#
# ⚠️ Les valeurs de repli ci-dessous sont recopiées mécaniquement depuis
# `build-android.yml` (workflow validé). Ne JAMAIS les ressaisir à la main : une
# seule lettre divergente dans le JWT invalide la signature et Supabase répond
# « 401 Invalid API key » dans l'application compilée. L'étape « Vérifier la
# configuration backend injectée » compare le `ref` du JWT au sous-domaine de
# SUPABASE_URL et fait échouer le build avant compilation en cas de divergence.

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Ne pas exécuter les tests (analyse seule)"
        type: boolean
        default: false
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/build-artifacts.yml"
      - "cineva/apps/**"
      - "cineva/packages/**"
      - "cineva/scripts/apply_android_icon.py"

permissions:
  contents: write # publication de la Release
  issues: write # rapport d'échec lisible

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5" # version validée du projet (Dart 3.5.4)
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://jbsagyavtiiqloutmqdk.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impic2FneWF2dGlpcWxvdXRtcWRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MjYzOTYsImV4cCI6MjA5OTAwMjM5Nn0.151rIhQiYxU7ovc5D51bm8OhWmPgO8irUx1OeZGhhg8' }}
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || '953735af94772da319cdbfdf861712a6' }}

jobs:
  # ─────────────────────────────────────────────────────────────── analyse
  analyze:
    name: Analyse + tests (16 packages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Résoudre les dépendances
        run: |
          set -o pipefail
          : > /tmp/pubget.log
          fail=0
          for f in cineva/packages/*/pubspec.yaml cineva/apps/*/pubspec.yaml; do
            d=$(dirname "$f")
            echo "════ pub get : $d" | tee -a /tmp/pubget.log
            (cd "$d" && flutter pub get 2>&1 | tee -a /tmp/pubget.log) || fail=1
          done
          if [ $fail -ne 0 ]; then
            echo "::error::flutter pub get en échec sur au moins un paquet — voir /tmp/pubget.log ci-dessous."
            tail -n 60 /tmp/pubget.log
            exit 1
          fi

      - name: flutter analyze
        run: |
          set -o pipefail
          : > /tmp/analyze.log
          for f in cineva/packages/*/pubspec.yaml cineva/apps/*/pubspec.yaml; do
            d=$(dirname "$f")
            echo "════ analyze : $d" | tee -a /tmp/analyze.log
            (cd "$d" && flutter analyze --no-fatal-infos 2>&1 | tee -a /tmp/analyze.log) || true
          done
          # Erreurs attribuées à leur paquet (le préfixe sert au rapport).
          awk '/^════ analyze : /{pkg=$4} /^[[:space:]]*error/{print pkg "|" $0}' \
            /tmp/analyze.log > /tmp/errors.log || true
          echo "── erreurs par paquet"
          cut -d'|' -f1 /tmp/errors.log | sort | uniq -c | sort -rn
          echo "── synthèse"
          grep -E "issues? found|No issues found" /tmp/analyze.log | tail -40
          # Échec dur si une seule erreur de compilation subsiste (formats
          # « error • … » et « error - … » de flutter analyze / dart analyze).
          if [ -s /tmp/errors.log ]; then
            echo "::error::$(wc -l < /tmp/errors.log) erreur(s) d'analyse bloquent le build."
            awk -F'|' -v cap=40 '{ if (c[$1]++ < cap) print }' /tmp/errors.log | head -300
            exit 1
          fi

      - name: Tests
        if: ${{ !inputs.skip_tests }}
        run: |
          set -o pipefail
          : > /tmp/test.log
          for f in cineva/packages/*/pubspec.yaml; do
            d=$(dirname "$f")
            [ -d "$d/test" ] || continue
            echo "════ test : $d" | tee -a /tmp/test.log
            if grep -q "sdk: flutter" "$f"; then
              (cd "$d" && flutter test 2>&1 | tee -a /tmp/test.log) || exit 1
            else
              (cd "$d" && dart test 2>&1 | tee -a /tmp/test.log) || exit 1
            fi
          done
          tail -20 /tmp/test.log

      - name: Publier les logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: |
            /tmp/pubget.log
            /tmp/analyze.log
            /tmp/errors.log
            /tmp/test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le diagnostic dans une issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WARN_TOTAL=$(awk '/^════ analyze : /{pkg=$4} /^[[:space:]]*warning/{print pkg}' \
            /tmp/analyze.log 2>/dev/null | wc -l)
          ERR_TOTAL=$(wc -l < /tmp/errors.log 2>/dev/null || echo 0)
          if [ "$ERR_TOTAL" -eq 0 ] && [ "$WARN_TOTAL" -eq 0 ]; then
            echo "Analyse clean : aucun commentaire publié."
            exit 0
          fi
          {
            echo "## analyze / tests — run ${GITHUB_RUN_NUMBER} (${ERR_TOTAL} erreur(s), ${WARN_TOTAL} avertissement(s))"
            echo ""
            echo "Branche \`${GITHUB_REF_NAME}\` · commit \`${GITHUB_SHA::7}\` ·"
            echo "[run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "### pub get (tail 40)"
            echo '```'
            tail -n 40 /tmp/pubget.log 2>/dev/null || echo "(pas de log pub get)"
            echo '```'
            echo ""
            echo "### Synthèse par paquet"
            echo '```'
            grep -E "════|issues? found|No issues found" /tmp/analyze.log 2>/dev/null | head -60
            echo '```'
            echo ""
            echo "### Erreurs par paquet"
            echo '```'
            cut -d'|' -f1 /tmp/errors.log 2>/dev/null | sort | uniq -c | sort -rn
            echo '```'
            echo ""
            echo "### Erreurs Dart (40 premières par paquet)"
            echo '```'
            awk -F'|' -v cap=40 '{ if (c[$1]++ < cap) print $1 "  ->  " substr($0, index($0, "|") + 1) }' \
              /tmp/errors.log 2>/dev/null | head -300
            echo '```'
            echo ""
            echo "### Avertissements par paquet (${WARN_TOTAL} au total)"
            echo '```'
            awk '/^════ analyze : /{pkg=$4} /^[[:space:]]*warning/{print pkg}' /tmp/analyze.log 2>/dev/null \
              | sort | uniq -c | sort -rn | head -30
            echo '```'
            echo ""
            echo "### Avertissements (25 premiers par paquet)"
            echo '```'
            awk '/^════ analyze : /{pkg=$4} /^[[:space:]]*warning/{ if (c[pkg]++ < 25) print pkg "  ->  " $0 }' \
              /tmp/analyze.log 2>/dev/null | head -200
            echo '```'
            echo ""
            echo "### Infos (compte par paquet)"
            echo '```'
            awk '/^════ analyze : /{pkg=$4} /^[[:space:]]*info/{print pkg}' /tmp/analyze.log 2>/dev/null \
              | sort | uniq -c | sort -rn | head -30
            echo '```'
            echo ""
            echo "### Tests (tail)"
            echo '```'
            tail -n 60 /tmp/test.log 2>/dev/null || echo "(pas de log de test)"
            echo '```'
          } > /tmp/analyze-report.md
          head -c 60000 /tmp/analyze-report.md > /tmp/analyze-report-trunc.md
          EXISTING=$(gh issue list --label build-artifacts-fail --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/analyze-report-trunc.md
          else
            gh issue create --title "build-artifacts failure report" \
              --label "build-artifacts-fail" --body-file /tmp/analyze-report-trunc.md 2>/dev/null ||
            gh issue create --title "build-artifacts failure report" --body-file /tmp/analyze-report-trunc.md
          fi

  # ─────────────────────────────────────────────────────────────── Android
  apk:
    name: APK release (User + Admin)
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Vérifier la configuration backend injectée
        shell: bash
        run: |
          set -e
          payload=$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          if [ "$pad" -gt 0 ]; then
            payload="$payload$(printf '=%.0s' $(seq 1 "$pad"))"
          fi
          json=$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          ref=$(printf '%s' "$json" | sed -n 's/.*"ref":"\([^"]*\)".*/\1/p')
          role=$(printf '%s' "$json" | sed -n 's/.*"role":"\([^"]*\)".*/\1/p')
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^./]+).*#\1#')
          echo "SUPABASE_URL = $SUPABASE_URL"
          echo "clé anon     = …$(printf '%s' "$SUPABASE_ANON_KEY" | tail -c 12) (longueur ${#SUPABASE_ANON_KEY})"
          echo "JWT          : ref=$ref role=$role"
          if [ -z "$json" ] || [ -z "$ref" ]; then
            echo "::error::SUPABASE_ANON_KEY illisible : le JWT n'est pas décodable (clé tronquée ou corrompue)."
            exit 1
          fi
          if [ "$ref" != "$host" ]; then
            echo "::error::Incohérence URL/clé : SUPABASE_URL pointe vers « $host » mais la clé anon est émise pour « $ref ». Supabase répondrait 401 Invalid API key."
            exit 1
          fi
          if [ "$role" != "anon" ]; then
            echo "::error::La clé fournie n'est pas une clé anon (role=$role) — ne jamais embarquer une clé service_role."
            exit 1
          fi
          echo "Configuration backend cohérente (ref=$ref, role=anon)."

      - name: Générer les châssis Android
        run: |
          set -e
          for app in cineva_mobile cineva_admin; do
            echo "── flutter create : $app"
            (cd "cineva/apps/$app" && flutter create --no-pub --platforms=android --org com.cineva --project-name "$app" .)
          done

      - name: Noms affichés + AGP/minSdk/Java 17
        run: |
          sed -i 's/android:label="cineva_mobile"/android:label="Cineva"/' \
            cineva/apps/cineva_mobile/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="cineva_admin"/android:label="Cineva Admin"/' \
            cineva/apps/cineva_admin/android/app/src/main/AndroidManifest.xml
          for app in cineva_mobile cineva_admin; do
            root="cineva/apps/$app/android"
            for f in "$root/app/build.gradle" "$root/app/build.gradle.kts"; do
              [ -f "$f" ] || continue
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f" || true
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$f" || true
              sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 24/' "$f" || true
              sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f" || true
              sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f" || true
              sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f" || true
            done
            for f in "$root/settings.gradle" "$root/settings.gradle.kts"; do
              [ -f "$f" ] || continue
              sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.1.0"/' "$f" || true
              sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.8.22"/' "$f" || true
              sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.1.0"/' "$f" || true
              sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.8.22"/' "$f" || true
            done
            echo "── config android : $app"
            grep -rnE "minSdk|com.android.application|kotlin.android|JavaVersion|jvmTarget" \
              "$root/settings.gradle" "$root/settings.gradle.kts" \
              "$root/app/build.gradle" "$root/app/build.gradle.kts" 2>/dev/null || true
          done

      - name: Icônes de lancement Cineva
        run: |
          python3 -m pip install --user --quiet pillow
          for app in cineva_mobile cineva_admin; do
            echo "── icônes : $app"
            python3 cineva/scripts/apply_android_icon.py "cineva/apps/$app"
          done

      - name: Compiler cineva_mobile (User)
        working-directory: cineva/apps/cineva_mobile
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=FIREBASE_ENABLED=false \
            2>&1 | tee /tmp/build-mobile.log

      - name: Compiler cineva_admin (Admin)
        working-directory: cineva/apps/cineva_admin
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=FIREBASE_ENABLED=false \
            2>&1 | tee /tmp/build-admin.log

      - name: Préparer les APK
        run: |
          mkdir -p dist
          cp cineva/apps/cineva_mobile/build/app/outputs/flutter-apk/app-release.apk dist/Cineva-User.apk
          cp cineva/apps/cineva_admin/build/app/outputs/flutter-apk/app-release.apk dist/Cineva-Admin.apk
          ls -lh dist/

      - name: Artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          retention-days: 14

      - name: Logs de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-logs
          path: |
            /tmp/build-mobile.log
            /tmp/build-admin.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier l'échec APK dans une issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## build APK en échec — run ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "[run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "### cineva_mobile (tail 120)"
            echo '```'
            tail -n 120 /tmp/build-mobile.log 2>/dev/null || echo "(pas de log mobile)"
            echo '```'
            echo "### cineva_admin (tail 120)"
            echo '```'
            tail -n 120 /tmp/build-admin.log 2>/dev/null || echo "(pas de log admin)"
            echo '```'
          } > /tmp/apk-report.md
          head -c 60000 /tmp/apk-report.md > /tmp/apk-report-trunc.md
          EXISTING=$(gh issue list --label build-artifacts-fail --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/apk-report-trunc.md
          else
            gh issue create --title "build-artifacts failure report" \
              --label "build-artifacts-fail" --body-file /tmp/apk-report-trunc.md 2>/dev/null ||
            gh issue create --title "build-artifacts failure report" --body-file /tmp/apk-report-trunc.md
          fi

  # ─────────────────────────────────────────────────────────────── Windows
  windows:
    name: EXE release (User + Admin, Windows x64)
    needs: analyze
    # Image épinglée : `windows-latest` (Server 2025) embarque Visual Studio 2026
    # depuis juin 2026, que Flutter 3.24.5 ne sait pas mapper — il réclame alors
    # le générateur CMake « Visual Studio 16 2019 », absent de l'image.
    # `windows-2022` fournit VS 2022 (17.x), seul toolchain validé ici.
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      # Chaque app est publiée indépendamment : un échec de la console admin ne
      # prive pas l'abonné de son .exe (et réciproquement).
      fail-fast: false
      matrix:
        include:
          - app: cineva_windows
            label: abonné
            exe: Cineva.exe
            zip: Cineva-User-Windows.zip
          - app: cineva_admin
            label: console admin
            exe: Cineva-Admin.exe
            zip: Cineva-Admin-Windows.zip
    steps:
      - uses: actions/checkout@v4

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Vérifier la configuration backend injectée
        shell: bash
        run: |
          set -e
          payload=$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          if [ "$pad" -gt 0 ]; then
            payload="$payload$(printf '=%.0s' $(seq 1 "$pad"))"
          fi
          json=$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          ref=$(printf '%s' "$json" | sed -n 's/.*"ref":"\([^"]*\)".*/\1/p')
          role=$(printf '%s' "$json" | sed -n 's/.*"role":"\([^"]*\)".*/\1/p')
          host=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^./]+).*#\1#')
          echo "SUPABASE_URL = $SUPABASE_URL"
          echo "clé anon     = …$(printf '%s' "$SUPABASE_ANON_KEY" | tail -c 12) (longueur ${#SUPABASE_ANON_KEY})"
          echo "JWT          : ref=$ref role=$role"
          if [ -z "$json" ] || [ -z "$ref" ]; then
            echo "::error::SUPABASE_ANON_KEY illisible : le JWT n'est pas décodable (clé tronquée ou corrompue)."
            exit 1
          fi
          if [ "$ref" != "$host" ]; then
            echo "::error::Incohérence URL/clé : SUPABASE_URL pointe vers « $host » mais la clé anon est émise pour « $ref ». Supabase répondrait 401 Invalid API key."
            exit 1
          fi
          if [ "$role" != "anon" ]; then
            echo "::error::La clé fournie n'est pas une clé anon (role=$role) — ne jamais embarquer une clé service_role."
            exit 1
          fi
          echo "Configuration backend cohérente (ref=$ref, role=anon)."

      - name: Vérifier le toolchain Windows (VS 2022 requis)
        shell: pwsh
        run: |
          $log = "cineva/apps/${{ matrix.app }}/toolchain.log"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property catalog_productDisplayVersion
          "Visual Studio : $version" | Tee-Object -FilePath $log
          "vswhere brut :" | Add-Content $log
          & $vswhere -latest -products * -property displayName,installationVersion,catalog_productLineVersion |
            Add-Content $log
          flutter doctor -v 2>&1 | Add-Content $log
          if (-not $version) { throw "Aucune instance Visual Studio avec les outils C++ x64." }
          if ($version -notmatch '^17\.') {
            throw "Visual Studio $version détecté : Flutter 3.24.5 exige VS 2022 (17.x). Utiliser runs-on: windows-2022."
          }
          "Toolchain Windows OK." | Add-Content $log

      - name: Générer le châssis Windows (${{ matrix.app }})
        shell: bash
        run: |
          set -e
          cd cineva/apps/${{ matrix.app }}
          flutter create --no-pub --platforms=windows --org com.cineva --project-name ${{ matrix.app }} .

      - name: Compiler ${{ matrix.app }} (release)
        shell: bash
        working-directory: cineva/apps/${{ matrix.app }}
        run: |
          set -o pipefail
          flutter pub get
          flutter build windows --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=TMDB_API_KEY="$TMDB_API_KEY" \
            --dart-define=FIREBASE_ENABLED=false \
            2>&1 | tee build-windows.log

      - name: Empaqueter le .exe (${{ matrix.label }})
        shell: pwsh
        run: |
          $rel = "cineva/apps/${{ matrix.app }}/build/windows/x64/runner/Release"
          if (-not (Test-Path $rel)) { throw "Dossier Release introuvable : $rel" }
          if (Test-Path "$rel/${{ matrix.app }}.exe") {
            Rename-Item "$rel/${{ matrix.app }}.exe" "${{ matrix.exe }}"
          }
          Get-ChildItem $rel | Select-Object Name, Length | Format-Table -AutoSize
          Compress-Archive -Path "$rel/*" -DestinationPath "${{ matrix.zip }}" -Force
          Get-Item ${{ matrix.zip }} | Select-Object Name, Length

      - name: Artefact Windows (${{ matrix.app }})
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-${{ matrix.app }}
          path: ${{ matrix.zip }}
          retention-days: 14

      - name: Log de build Windows (${{ matrix.app }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log-${{ matrix.app }}
          path: |
            cineva/apps/${{ matrix.app }}/build-windows.log
            cineva/apps/${{ matrix.app }}/toolchain.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier l'échec Windows dans une issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## build Windows en échec — ${{ matrix.app }} (${{ matrix.label }}) — run ${GITHUB_RUN_NUMBER}"
            echo ""
            echo "[run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "### Toolchain (vswhere + flutter doctor)"
            echo '```'
            cat cineva/apps/${{ matrix.app }}/toolchain.log 2>/dev/null | head -60 || echo "(pas de log toolchain)"
            echo '```'
            echo ""
            echo "### ${{ matrix.app }} (tail 150)"
            echo '```'
            tail -n 150 cineva/apps/${{ matrix.app }}/build-windows.log 2>/dev/null || echo "(pas de log)"
            echo '```'
          } > /tmp/win-report.md
          head -c 60000 /tmp/win-report.md > /tmp/win-report-trunc.md
          EXISTING=$(gh issue list --label build-artifacts-fail --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/win-report-trunc.md
          else
            gh issue create --title "build-artifacts failure report" \
              --label "build-artifacts-fail" --body-file /tmp/win-report-trunc.md 2>/dev/null ||
            gh issue create --title "build-artifacts failure report" --body-file /tmp/win-report-trunc.md
          fi

  # ─────────────────────────────────────────────────────────────── Release
  release:
    name: Publier les binaires
    needs: [apk, windows]
    if: ${{ always() && (needs.apk.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les binaires
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FILES=$(find dist -type f \( -name '*.apk' -o -name '*.zip' \) | sort)
          if [ -z "$FILES" ]; then echo "::error::Aucun binaire produit."; exit 1; fi
          (cd dist && find . -type f \( -name '*.apk' -o -name '*.zip' \) -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt)
          TAG="binaries-${GITHUB_RUN_NUMBER}"
          {
            echo "Binaires Cineva compilés depuis la branche \`$GITHUB_REF_NAME\` (commit \`${GITHUB_SHA::7}\`)."
            echo ""
            echo "| Fichier | Cible | Installation |"
            echo "| --- | --- | --- |"
            echo "| **Cineva-User.apk** | Android — application abonné (\`com.cineva.cineva_mobile\`) | Transférer sur le téléphone, autoriser les « sources inconnues », ouvrir le fichier |"
            echo "| **Cineva-Admin.apk** | Android — console d'administration (\`com.cineva.cineva_admin\`) | idem |"
            echo "| **Cineva-User-Windows.zip** | Windows x64 — application abonné | Dézipper puis lancer \`Cineva.exe\` (aucun installateur requis) |"
            echo "| **Cineva-Admin-Windows.zip** | Windows x64 — console d'administration | Dézipper puis lancer \`Cineva-Admin.exe\` (aucun installateur requis) |"
            echo ""
            echo "Connectés au **backend Supabase réel** (configuration injectée à la compilation)."
            echo "Notifications push désactivées (FCM non configuré)."
            echo ""
            echo "**Signature Android** : clé de debug — installable directement sur appareil,"
            echo "mais refusée par le Play Store. Pour une publication, renseigner un keystore"
            echo "(voir \`cineva/docs/08_build_release.md\`)."
            echo ""
            echo "Empreintes SHA-256 dans \`SHA256SUMS.txt\`."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" $FILES dist/SHA256SUMS.txt \
              --title "Cineva — binaires (APK User + Admin, EXE Windows User + Admin) #${GITHUB_RUN_NUMBER}" \
              --notes-file notes.md
          fi
          echo "Release publiée : $TAG"
          gh release view "$TAG" --json url --jq .url
