name: cineva_macos
description: Cineva user application for macOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Lecture vidéo desktop (media_kit) : absent des APK mobiles, qui continuent
  # d'utiliser `video_player`.
  cineva_desktop_video:
    path: ../../packages/desktop_video
  cineva_shared:
    path: ../../packages/shared
  cineva_widgets:
    path: ../../packages/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
