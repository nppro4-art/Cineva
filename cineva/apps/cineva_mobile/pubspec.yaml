name: cineva_mobile
description: Cineva user application for Android and iOS.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cineva_shared:
    path: ../../packages/shared
  cineva_widgets:
    path: ../../packages/widgets
  # Pin : app_links ≥6.4 casse AGP avec Flutter 3.24.5
  # (« Could not get unknown property 'flutter' for extension 'android' »)
  app_links: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
