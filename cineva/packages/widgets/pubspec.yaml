name: cineva_widgets
description: Feature presentation layer and reusable widgets for Cineva.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  cineva_animations:
    path: ../animations
  cineva_audio_engine:
    path: ../audio_engine
  cineva_models:
    path: ../models
  cineva_repositories:
    path: ../repositories
  cineva_services:
    path: ../services
  cineva_shared:
    path: ../shared
  cineva_theme:
    path: ../theme
  cineva_ui:
    path: ../ui
  equatable: ^2.0.5
  file_picker: ^8.1.2
  intl: ^0.19.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
