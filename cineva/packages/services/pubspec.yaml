version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cineva_models:
    path: ../models
  cineva_shared:
    path: ../shared
  crypto: ^3.0.5
  connectivity_plus: ^6.1.1
