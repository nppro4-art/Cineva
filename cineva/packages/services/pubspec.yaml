  package_info_plus: ^8.1.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  universal_io: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
